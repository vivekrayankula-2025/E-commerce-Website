<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Shopora</title><link rel="stylesheet" href="css/style.css"></head><body><div class="site-mini-nav"><div class="container"><a href="index.html">🏠 Shopora</a><a href="products.html">All Products</a><a href="categories.html">Categories</a><a href="deals.html">Deals</a><a href="wishlist.html">Wishlist</a><a href="account.html">Account & Orders</a><a href="cart.html">🛒 Cart</a><a href="help.html">Help</a></div></div><main class="page-shell"><section class="page-hero"><span class="section-label">MY SHOPORA</span><h1>Wishlist ❤️</h1><p>Save products you want to compare or buy later.</p></section><div id="wishlistGrid" class="shopora-product-grid"></div><div id="wishlistEmpty" class="empty-page"><h2>Your wishlist is empty</h2><p>Add products using the heart button on any product card.</p><a class="shop-btn primary" href="products.html">Browse Products</a></div></main><script src="js/data.js"></script><script>const ids=JSON.parse(localStorage.getItem("wishlist")||"[]");const grid=document.getElementById("wishlistGrid"),empty=document.getElementById("wishlistEmpty");const items=products.filter(p=>ids.includes(p.id));if(items.length){empty.style.display="none";grid.innerHTML=items.map(p=>`<article class="product-card"><a class="product-image-wrapper" href="product.html?id=${p.id}"><img class="product-image" src="${p.image}?auto=format&fit=crop&w=700&q=80" onerror="this.onerror=null;this.src='assests/images/${p.category}.svg'" alt="${p.name}"></a><div class="product-content"><span class="category">${p.category}</span><h3>${p.name}</h3><div class="rating">⭐ ${p.rating}</div><div class="product-bottom"><strong>₹${p.price.toLocaleString("en-IN")}</strong><button class="add-btn" onclick="add(${p.id})">Add to Cart</button></div><button class="shop-btn" style="margin-top:10px" onclick="removeItem(${p.id})">Remove from Wishlist</button></div></article>`).join("");}function add(id){let c=JSON.parse(localStorage.getItem("cart")||"[]"),p=products.find(x=>x.id===id),e=c.find(x=>x.id===id);if(e)e.quantity++;else c.push({...p,quantity:1});localStorage.setItem("cart",JSON.stringify(c));alert(p.name+" added to cart!");}function removeItem(id){let a=JSON.parse(localStorage.getItem("wishlist")||"[]").filter(x=>x!==id);localStorage.setItem("wishlist",JSON.stringify(a));location.reload();}</script><footer class="shopora-footer"><div class="container footer-bottom"><div>© 2026 Shopora. All rights reserved.</div><div><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="help.html">Help</a></div></div></footer></body></html>
